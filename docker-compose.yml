services:
  website:
    image: ghcr.io/digitalica/flighttracker:latest
    # build: website/   # uncomment to build locally instead
    restart: unless-stopped
    volumes:
      - db_data:/data
    environment:
      - DB_PATH=/data/flighttracker.db
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # main site
      - "traefik.http.routers.flighttracker.rule=Host(`phtgc.nl`)"
      - "traefik.http.routers.flighttracker.entrypoints=websecure"
      - "traefik.http.routers.flighttracker.tls.certresolver=letsencrypt"
      - "traefik.http.services.flighttracker.loadbalancer.server.port=5000"
      # www → apex redirect
      - "traefik.http.routers.flighttracker-www.rule=Host(`www.phtgc.nl`)"
      - "traefik.http.routers.flighttracker-www.entrypoints=websecure"
      - "traefik.http.routers.flighttracker-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.flighttracker-www.middlewares=redirect-www@docker"
      - "traefik.http.middlewares.redirect-www.redirectregex.regex=^https://www\\.phtgc\\.nl(.*)"
      - "traefik.http.middlewares.redirect-www.redirectregex.replacement=https://phtgc.nl$${1}"
      - "traefik.http.middlewares.redirect-www.redirectregex.permanent=true"

volumes:
  db_data:

networks:
  proxy:
    external: true
